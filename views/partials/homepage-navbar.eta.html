<nav class="bg-white/90 backdrop-blur border-b border-slate-200 sticky top-0 z-30">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
    <a href="/" class="flex items-center gap-2 font-extrabold text-lg text-studio-navy tracking-tight shrink-0">
      <span class="w-8 h-8 rounded-lg bg-studio-gold text-studio-navy flex items-center justify-center text-base">C</span>
      CoSign
    </a>

    <div class="flex items-center gap-1 sm:gap-3 text-sm">
      <a href="/" class="hidden sm:inline-flex items-center gap-1.5 px-3 py-2 rounded-lg font-semibold text-studio-navy hover:bg-slate-100">
        <i class="bx bx-compass text-lg"></i> Explore
      </a>

      <% if (it.user) { %>
        <a href="/studio" class="inline-flex items-center gap-1.5 px-3 py-2 rounded-lg font-semibold text-studio-navy hover:bg-slate-100">
          <i class="bx bxs-dashboard text-lg"></i> <span class="hidden sm:inline">Studio</span>
        </a>
        <a href="/studio/settings" class="flex items-center gap-2 px-2 py-1.5 rounded-full hover:bg-slate-100">
          <% if (it.user.avatar_path) { %>
            <img src="/uploads/<%= it.user.avatar_path.replace(/^uploads\//, '') %>" alt=""
              class="w-8 h-8 rounded-full object-cover border-2 border-studio-gold" />
          <% } else { %>
            <span class="w-8 h-8 rounded-full bg-studio-navy text-studio-gold text-xs font-bold flex items-center justify-center border-2 border-studio-gold">
              <%= it.user.username.charAt(0).toUpperCase() %>
            </span>
          <% } %>
          <span class="hidden sm:inline font-semibold text-studio-navy"><%= it.user.username %></span>
        </a>
        <form method="post" action="/studio/logout" class="inline">
          <button type="submit" title="Sign out"
            class="px-2 py-2 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50">
            <i class="bx bx-log-out text-xl"></i>
          </button>
        </form>
      <% } else { %>
        <a href="/studio/login" class="px-3 py-2 rounded-lg font-semibold text-studio-navy hover:bg-slate-100">Sign in</a>
        <a href="/studio/register" class="inline-flex items-center gap-1.5 bg-studio-navy text-white px-4 py-2 rounded-xl font-semibold hover:bg-studio-navy-deep">
          <i class="bx bx-user-plus text-lg"></i> <span class="hidden sm:inline">Register</span>
        </a>
      <% } %>
    </div>
  </div>
</nav>
