<% layout("/layouts/studio-auth") %>
<% it.title = "Register — CoSign Studio" %>

<h1 class="text-2xl font-extrabold text-white text-center tracking-tight">Join the studio</h1>
<p class="text-sm text-slate-300 text-center mt-1 mb-6">Create your account and start building collections.</p>
<%~ include("/partials/errors", { errors: it.errors }) %>
<form method="post" action="/studio/register" class="bg-white rounded-2xl p-6 space-y-4 shadow-xl">
  <div>
    <label for="full_name" class="block text-sm font-medium mb-1">Full name (optional)</label>
    <div class="relative">
      <i class="bx bx-id-card absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
      <input id="full_name" name="full_name" value="<%= it.old.full_name ?? '' %>" autocomplete="name"
        placeholder="e.g. Hudya Ramadhana"
        class="w-full border border-slate-300 rounded-xl pl-10 pr-3 py-2 focus:outline-none focus:ring-2 focus:ring-studio-gold" />
    </div>
  </div>
  <div>
    <label for="username" class="block text-sm font-medium mb-1">Username</label>
    <div class="relative">
      <i class="bx bx-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
      <input id="username" name="username" required value="<%= it.old.username ?? '' %>" autocomplete="username"
        placeholder="e.g. hudya"
        pattern="[a-z0-9_-]{3,20}" title="3–20 characters: lowercase letters, numbers, underscore or hyphen"
        class="w-full border border-slate-300 rounded-xl pl-10 pr-3 py-2 focus:outline-none focus:ring-2 focus:ring-studio-gold" />
    </div>
  </div>
  <div>
    <label for="password" class="block text-sm font-medium mb-1">Password</label>
    <div class="relative">
      <i class="bx bx-lock-alt absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg"></i>
      <input id="password" name="password" type="password" required autocomplete="new-password"
        placeholder="At least 6 characters"
        class="w-full border border-slate-300 rounded-xl pl-10 pr-3 py-2 focus:outline-none focus:ring-2 focus:ring-studio-gold" />
    </div>
  </div>
  <button type="submit" class="w-full bg-studio-gold text-studio-navy font-extrabold py-2.5 rounded-xl hover:bg-studio-gold-deep hover:text-white">
    <i class="bx bx-user-plus"></i> Create account
  </button>
</form>
<p class="text-center text-sm text-slate-300 mt-4">
  Already have an account? <a href="/studio/login" class="text-studio-gold font-semibold hover:underline">Sign in</a>
</p>
